---
name: Next Explorer Ingress
version: "1.5.1"
slug: nextexplorer_ingress
description: Next Explorer patched for native Home Assistant Ingress
url: "https://github.com/aranaformae/HA-NextExplorer"
image: "ghcr.io/aranaformae/ha-nextexplorer"
arch:
  - aarch64
  - amd64
init: false
startup: application
ingress: true
ingress_port: 3000
panel_icon: mdi:folder-open
panel_title: Bestanden
panel_admin: true
map:
  - type: addon_config
    read_only: false
  - type: homeassistant_config
    read_only: false
  - type: share
    read_only: false
  - type: media
    read_only: false
  - type: backup
    read_only: false
options:
  public_url: ""
  root_volumes:
    - homeassistant_config
    - share
    - media
    - backup
  auth_mode: "disabled"
  log_level: info
  env_vars: []
schema:
  root_volumes:
    - "match(^(homeassistant_config|share|media|backup)$)"
  log_level: list(trace|debug|info|warn|error)
  public_url: str?
  auth_mode: list(both|local|oidc|disabled)
  env_vars:
    - name: str
      value: str
