name: Next Explorer Ingress
version: "1.5.0"
slug: nextexplorer_ingress
description: Next Explorer patched for native Home Assistant Ingress
url: "https://github.com/aranaformae/HA-NextExplorer"
image: "ghcr.io/aranaformae/ha-nextexplorer"
arch:
  - aarch64
  - amd64
init: false
startup: application
ingress: true
ingress_port: 3000
panel_icon: mdi:folder-open
panel_title: Bestanden
panel_admin: true
map:
  - addon_config:rw
  - all_addon_configs:rw
  - homeassistant_config:rw
  - ssl:rw
  - media:rw
  - backup:rw
  - addons:rw
  - share:rw
options:
  public_url: ""
  root_volumes:
    - homeassistant_config
    - share
    - media
    - backup
  auth_mode: "disabled"
  log_level: info
  env_vars: []
schema:
  root_volumes:
    - str
  log_level: list(trace|debug|info|warn|error)
  public_url: str?
  auth_mode: list(both|local|oidc|disabled)
  env_vars:
    - name: str
      value: str
