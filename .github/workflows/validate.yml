name: Validate app build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AppArmor profile
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor apparmor-utils
          apparmor_parser -Q -K nextexplorer/apparmor.txt

      - name: Verify AppArmor runtime permissions
        run: |
          grep -Eq '^\s*/app/\*\*\s+mr,' nextexplorer/apparmor.txt
          grep -Eq '^\s*/storage/\s+r,' nextexplorer/apparmor.txt
          grep -Eq '^\s*/(homeassistant|share|media|backup)/\s+rw,' nextexplorer/apparmor.txt
          grep -Eq '^\s*/dev/ptmx\s+rw,' nextexplorer/apparmor.txt
          grep -Eq '^\s*/dev/pts/\*\*\s+rw,' nextexplorer/apparmor.txt

      - name: Build app image
        run: |
          docker build \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg BUILD_VERSION=ci \
            -t ha-nextexplorer:test \
            nextexplorer

      - name: Verify terminal default working directory patch
        run: |
          docker run --rm --entrypoint sh ha-nextexplorer:test -c \
            "grep -F 'const defaultCwd = process.env.VOLUME_ROOT || process.env.HOME || process.cwd();' /app/src/services/terminalService.js"

      - name: Smoke-test native Node modules
        run: |
          docker run --rm --entrypoint node ha-nextexplorer:test \
            -e "const sqlite3=require('sqlite3'); const db=new sqlite3.Database(':memory:'); db.close(); console.log('sqlite3 native module OK')"

      - name: Smoke-test storage root listing
        run: |
          docker run --rm --entrypoint sh ha-nextexplorer:test -c \
            "mkdir -p /storage/test-volume && node -e \"const fs=require('fs'); const entries=fs.readdirSync('/storage'); if(!entries.includes('test-volume')) process.exit(1); console.log('storage root listing OK')\""

      - name: Smoke-test built-in terminal PTY
        run: |
          docker run --rm --entrypoint sh ha-nextexplorer:test -c '
            mkdir -p /storage &&
            exec node -e '\''
              const pty = require("@homebridge/node-pty-prebuilt-multiarch");
              const term = pty.spawn("bash", ["-lc", "printf terminal-pty-ok"], {
                name: "xterm-256color",
                cols: 80,
                rows: 30,
                cwd: "/storage",
                env: { ...process.env, TERM: "xterm-256color" }
              });
              let output = "";
              const timer = setTimeout(() => { console.error("PTY timeout"); term.kill(); process.exit(1); }, 10000);
              term.onData(data => { output += data; });
              term.onExit(({ exitCode }) => {
                clearTimeout(timer);
                if (exitCode !== 0 || !output.includes("terminal-pty-ok")) {
                  console.error({ exitCode, output });
                  process.exit(1);
                }
                console.log("terminal PTY OK");
              });
            '\''
          '
