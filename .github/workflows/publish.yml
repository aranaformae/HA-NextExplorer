name: Publish app image

on:
  push:
    branches: [main]
    paths:
      - 'nextexplorer/config.yaml'
  workflow_dispatch:
    inputs:
      version:
        description: App version to publish (for example 1.5.1)
        required: true
        type: string

permissions: {}

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: ha-nextexplorer
  VERSION: ${{ inputs.version || '' }}

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate version input
        shell: bash
        run: |
          set -euo pipefail
          configured=$(sed -nE 's/^version: "([^"]+)"/\1/p' nextexplorer/config.yaml)
          if [[ -z "${VERSION}" ]]; then echo "VERSION=$configured" >> "$GITHUB_ENV"; VERSION="$configured"; fi
          [[ "${VERSION}" == "$configured" ]] || { echo "::error::Version differs from config.yaml ($configured)"; exit 1; }
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: ${VERSION}"
            exit 1
          fi

  init:
    name: Initialize build
    needs: validate-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          configured=$(sed -nE 's/^version: "([^"]+)"/\1/p' nextexplorer/config.yaml)
          echo "version=$configured" >> "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@4de35182ce1e329181bffcbcc84d33db5e2c7e10
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and publish image
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: nextexplorer
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
          push: 'true'
          version: ${{ env.VERSION }}

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@4de35182ce1e329181bffcbcc84d33db5e2c7e10
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
