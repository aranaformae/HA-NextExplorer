name: Check upstream NextExplorer releases

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only inspect and report releases (no PRs or issues)'
        type: boolean
        default: true
      include_preview:
        description: 'Track prerelease versions'
        type: boolean
        default: true
  pull_request:
    paths:
      - '.github/workflows/upstream-check.yml'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-release-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare stable and preview releases
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pinned=$(sed -nE 's/.*git clone .*--branch (v[0-9]+\.[0-9]+\.[0-9]+).*/\1/p' nextexplorer/Dockerfile | head -n1)
          test -n "$pinned"
          gh api 'repos/nxzai/NextExplorer/releases?per_page=100' > "$RUNNER_TEMP/releases.json"
          stable=$(jq -r '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | first | .tag_name // empty' "$RUNNER_TEMP/releases.json")
          preview=$(jq -r '[.[] | select(.draft == false and .prerelease == true)] | first | .tag_name // empty' "$RUNNER_TEMP/releases.json")
          test -n "$stable"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "preview=$preview" >> "$GITHUB_OUTPUT"
          echo "Pinned $pinned; stable $stable; preview $preview"
          { echo '### Upstream release check'; echo "- Pinned: $pinned"; echo "- Stable: $stable"; echo "- Preview: ${preview:-none}"; echo "- Mode: ${{ github.event_name == 'schedule' && 'scheduled' || 'read-only dry run' }}"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Create stable update pull request
        if: github.event_name == 'schedule' && steps.versions.outputs.pinned != steps.versions.outputs.stable
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.versions.outputs.pinned }}
          STABLE: ${{ steps.versions.outputs.stable }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/nextexplorer-${STABLE}"
          if gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" >/dev/null 2>&1; then
            echo "Branch already exists; avoiding overwriting human changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          sed -i "s/--branch ${PINNED} /--branch ${STABLE} /" nextexplorer/Dockerfile
          git add nextexplorer/Dockerfile
          git commit -m "chore: test upstream NextExplorer ${STABLE}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: test NextExplorer ${STABLE} (stable)" \
            --body "Automated candidate from ${PINNED} to ${STABLE}. CI must pass. **Manual review required** for Ingress, AppArmor, authentication, persistence and runtime compatibility. This PR does not publish or deploy automatically."
      - name: Track preview release separately
        if: github.event_name == 'schedule' && steps.versions.outputs.preview != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ steps.versions.outputs.preview }}
        shell: bash
        run: |
          set -euo pipefail
          title="Evaluate NextExplorer ${PREVIEW} prerelease"
          if ! gh issue list --state all --search "\"$title\" in:title" --json title --jq '.[].title' | grep -Fxq "$title"; then
            gh issue create --title "$title" \
              --body "Prerelease ${PREVIEW} detected. Evaluate on an isolated branch/image; do not automatically promote to the stable Home Assistant channel. Verify Node runtime, Ingress, auth, mounts, terminal, AppArmor, data migration and rollback."
          fi
